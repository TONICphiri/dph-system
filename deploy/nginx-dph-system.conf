server {
    listen 80;
    server_name your-domain.mw www.your-domain.mw;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.mw www.your-domain.mw;

    ssl_certificate /etc/letsencrypt/live/your-domain.mw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.mw/privkey.pem;

    root /var/www/dph-system/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

server {
    listen 80;
    server_name your-domain.mw www.your-domain.mw;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.mw www.your-domain.mw;

    ssl_certificate /etc/letsencrypt/live/your-domain.mw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.mw/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/dph-system/public;
    index index.php;
    # Backup restores are uploaded through the app. Keep this at least as
    # large as PHP's upload_max_filesize and post_max_size.
    client_max_body_size 64M;

    # PHP already compresses when RESPONSE_COMPRESSION=true. Enable nginx gzip
    # only if RESPONSE_COMPRESSION=false, otherwise responses are compressed twice.
    # gzip on;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite output is content-hashed, so it can be cached forever.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must be revalidated so an update reaches workers.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
